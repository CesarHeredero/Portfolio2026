services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio2026_app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - NODE_ENV=production
    env_file:
      - .env
    ports:
      # Solo accesible desde localhost → Nginx Proxy Manager hace el proxy
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/es', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
