services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio2026_app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - NODE_ENV=production
    env_file:
      - .env
    ports:
      # Solo accesible desde localhost → Nginx Proxy Manager hace el proxy
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/es"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
